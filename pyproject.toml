[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pedidos-mcp-backend"
version = "0.1.0"
description = "Catálogo, documentos e rascunhos de pedidos via REST e MCP"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "fastembed>=0.7,<1",
  "mcp>=1.26,<2",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6,<7",
  "python-multipart>=0.0.22,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
  "anthropic>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "reportlab>=4,<5",
    "pypdfium2>=4,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pedidos", "src/extrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: exige PostgreSQL de teste com pgvector"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
