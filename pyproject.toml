[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pedidos-mcp-backend"
version = "0.1.0"
description = "Backend acadêmico de catálogo, busca e rascunhos de pedidos via MCP"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "fastembed>=0.7,<1",
  "mcp>=1.26,<2",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "reportlab>=4,<5", "pypdf>=5,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/pedidos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exige PostgreSQL de teste com pgvector"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
