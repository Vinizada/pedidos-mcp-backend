name: pedidos-mcp

x-app: &app
  image: pedidos-mcp-backend:local
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pedidos}:${POSTGRES_PASSWORD:?Execute scripts/configurar_env.py}@db:5432/${POSTGRES_DB:-pedidos}
    API_TOKEN: ${API_TOKEN:?Execute scripts/configurar_env.py}
    SEARCH_MODE: ${SEARCH_MODE:-hybrid}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    EMBEDDING_CACHE_DIR: /home/app/.cache/embeddings
    UPLOAD_DIR: /home/app/uploads
    ALLOWED_HOSTS: '${ALLOWED_HOSTS:-["localhost","127.0.0.1","backend"]}'
    ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:8000","http://127.0.0.1:8000"]}'
  volumes:
    - model_cache:/home/app/.cache/embeddings
    - uploads_data:/home/app/uploads

services:
  db:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pedidos}
      POSTGRES_USER: ${POSTGRES_USER:-pedidos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/configurar_env.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  init:
    <<: *app
    command: ["python", "-m", "pedidos.bootstrap"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Agente consumidor: só fala com o backend por MCP/REST. Sem credenciais do banco, sem
  # volumes e sem data/ (gabaritos ficam fora da imagem pelo .dockerignore).
  agente:
    image: pedidos-mcp-backend:local
    build: .
    profiles: ["agente"]
    command: ["python", "-m", "extrator.worker"]
    environment:
      MCP_URL: http://backend:8000/mcp
      API_TOKEN: ${API_TOKEN:?Execute scripts/configurar_env.py}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
      LLM_EFFORT: ${LLM_EFFORT:-medium}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  test-db:
    image: pgvector/pgvector:0.8.2-pg17
    profiles: ["test"]
    environment:
      POSTGRES_DB: pedidos_test
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos_test_local
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    image: pedidos-mcp-tests:local
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://pedidos:pedidos_test_local@test-db:5432/pedidos_test
      API_TOKEN: tests-only-not-for-deployment-00000000
      SEARCH_MODE: lexical
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres_data:
  model_cache:
  uploads_data:
